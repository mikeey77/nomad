<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05100b">
<title>NOMAD Mobile</title>
<!--MANIFEST-->
<style>/*MAPLIBRE_CSS*/</style>
<style>
/*FONTS*/
#v-gps .pad{padding-bottom:30px}
.cmp-wrap{display:flex;flex-direction:column;align-items:center}
#cmp{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:8px auto 0;border-radius:50%;background:radial-gradient(circle,#0c2318 0,#06120c 70%);border:1px solid var(--line2);box-shadow:0 0 40px rgba(46,207,133,.12),inset 0 0 30px rgba(0,0,0,.6)}
.rose{position:absolute;inset:0;transition:transform .25s linear}
.rose span{position:absolute;left:50%;top:50%;font:700 14px var(--mono);color:var(--dim);transform-origin:0 0}
.rose span.n{color:#ff5470;font-size:18px}
.rose i{position:absolute;left:50%;top:50%;width:1px;height:9px;background:var(--line2);transform-origin:0 0}
.rose i.m{height:16px;background:var(--dim)}
#cmp::after{content:"";position:absolute;left:50%;top:-2px;width:0;height:0;border:8px solid transparent;border-top:14px solid var(--acc);transform:translateX(-50%);filter:drop-shadow(0 0 6px var(--acc))}
.tgt{position:absolute;inset:14%;transition:transform .25s linear;display:none}
.tgt.on{display:block}
.tgt i{position:absolute;left:50%;top:0;width:0;height:0;border:13px solid transparent;border-bottom:30px solid #ffd23a;transform:translateX(-50%);filter:drop-shadow(0 0 8px rgba(255,210,58,.7))}
.cmp-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.cmp-c b{font:700 34px var(--mono);color:var(--hi)}
.cmp-c small{font:600 11px var(--mono);letter-spacing:.2em;color:var(--dim)}
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.gstats div{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px}
.gstats small{display:block;font:600 9.5px var(--mono);letter-spacing:.18em;color:var(--dim)}
.gstats b{font:600 15px var(--mono);color:var(--hi);word-break:break-all}
.gstats .w{grid-column:1/-1}
.trk{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px}
.trk .tn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.trk .tn b{display:block;font:700 20px var(--mono);color:var(--hi)}
.trk .tn small{font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--dim)}
.trk.rec{border-color:#ff5470;box-shadow:0 0 20px rgba(255,84,112,.15)}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5470;margin-right:6px;animation:rp 1s infinite}
@keyframes rp{50%{opacity:.25}}
.nav-card{border:1px solid var(--acc);background:rgba(46,207,133,.08);border-radius:16px;padding:12px 14px;margin-top:14px}
.nav-card .ni{font:700 17px/1.3 system-ui;color:var(--hi)}
.nav-card .nd{font:700 26px var(--mono);color:var(--acc2)}
.nav-card .ns{font:12px var(--mono);color:var(--dim);margin-top:4px}
.nav-card.off{border-color:#ffb63a;background:rgba(255,182,58,.08)}
.picker{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.picker>div{width:100%;max-height:70vh;overflow:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:16px 14px calc(var(--sab) + 16px)}
:root{--bg:#05100b;--bg2:#0a1912;--card:#0c1d15;--line:#173a29;--line2:#22513a;--acc:#2ecf85;--acc2:#9dffcf;--hi:#e8fff3;--txt:#bfe3cf;--dim:#6f9a85;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 60% at 50% -10%,#0d2a1d 0,transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(var(--sat) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--acc);font:700 17px var(--mono);box-shadow:0 0 18px rgba(46,207,133,.18) inset}
.brand{font:600 12px var(--mono);letter-spacing:.32em;color:var(--acc)}
.brand small{display:block;letter-spacing:.12em;color:var(--dim);font-weight:400;font-size:10.5px}
.hbtn{margin-left:auto;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font:600 11px var(--mono);letter-spacing:.12em;color:var(--acc)}
main{position:absolute;inset:0;padding-top:calc(var(--sat) + 58px);padding-bottom:calc(var(--sab) + 64px)}
.view{position:absolute;inset:calc(var(--sat) + 58px) 0 calc(var(--sab) + 64px);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;padding:6px 8px calc(var(--sab) + 6px);background:rgba(5,16,11,.94);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
nav button{flex:1;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(46,207,133,.6))}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pad{padding:6px 14px 24px}
.k{font:600 10.5px var(--mono);letter-spacing:.24em;color:var(--dim);margin:18px 2px 8px}
.search{display:flex;align-items:center;gap:10px;height:46px;border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:0 14px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--hi);font-size:16px;min-width:0}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:8px;animation:up .25s both}
.card img,.card .ph{width:40px;height:40px;border-radius:10px;flex:none;background:#0f2a1d;object-fit:cover}
.card b{display:block;color:var(--hi);font-weight:600;line-height:1.25}
.card small{color:var(--dim);font:11.5px var(--mono)}
.card .go{margin-left:auto;color:var(--dim)}
.hit{display:block;padding:11px 12px;border-bottom:1px solid var(--line);color:var(--hi);text-decoration:none}
.hit small{display:block;color:var(--dim);font:11px var(--mono)}
.empty{border:1px dashed var(--line2);border-radius:16px;padding:22px 18px;text-align:center;color:var(--dim);margin-top:10px}
.empty h3{margin:6px 0;color:var(--hi);font:600 14px var(--mono);letter-spacing:.18em}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:14px;border:1px solid var(--acc);background:rgba(46,207,133,.12);color:var(--acc2);font:700 13px var(--mono);letter-spacing:.18em;margin-top:14px;box-shadow:0 0 24px rgba(46,207,133,.15)}
.big svg{width:20px;height:20px}
.tip{font-size:13px;color:var(--dim);margin-top:14px;line-height:1.55}
.tip code{font-family:var(--mono);color:var(--txt);font-size:12px}
#reader{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column}
#reader.on{display:flex}
.rbar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg2)}
.rbar button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--acc);flex:none}
.rbar button svg{width:19px;height:19px}
.rbar .search{flex:1;height:40px;border-radius:12px;min-width:0;padding:0 10px}
#rhits{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 58px);z-index:2;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;max-height:60vh;overflow:auto;display:none;box-shadow:0 16px 40px rgba(0,0,0,.6)}
#frame{flex:1;border:0;width:100%;background:#fff}
#rload{position:absolute;top:calc(var(--sat) + 57px);left:0;height:2px;background:var(--acc);box-shadow:0 0 8px var(--acc);width:0;transition:width .3s}
#map{position:absolute;inset:0}
.mapui{position:absolute;left:12px;right:12px;top:10px;z-index:2}
.fab{position:absolute;right:12px;bottom:48px;z-index:2;width:48px;height:48px;border-radius:14px;border:1px solid var(--line2);background:rgba(12,29,21,.92);display:grid;place-items:center;color:var(--acc)}
.fab svg{width:22px;height:22px}
.maplibregl-ctrl-attrib{font-size:10px!important}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 80px);transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--card);border:1px solid var(--line2);color:var(--hi);padding:10px 16px;border-radius:12px;z-index:20;font-size:13.5px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font:600 11px var(--mono);letter-spacing:.1em;color:var(--dim)}
.seg button.on{color:var(--acc);border-color:var(--acc)}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(transparent 0,var(--bg) 92%),repeating-linear-gradient(90deg,rgba(46,207,133,.04) 0 1px,transparent 1px 44px),repeating-linear-gradient(0deg,rgba(46,207,133,.04) 0 1px,transparent 1px 44px)}
#poibar{position:absolute;left:0;right:0;top:8px;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:2px 10px 6px;scrollbar-width:none}
#poibar::-webkit-scrollbar{display:none}
.nlogo{display:none}
#syncDot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#3a4a42;flex:none}
#syncDot.on{background:var(--acc);box-shadow:0 0 10px var(--acc)}#syncDot.wait{background:#ffb63a}
#syncDot+.hbtn{margin-left:10px}
.live{font:600 12px var(--mono);color:var(--dim)}.live.on{color:var(--acc)}
.big.ghost{background:transparent;border-color:var(--line2);color:var(--dim);box-shadow:none}
.mslot{cursor:pointer}.mslot.add{border-style:dashed;--rc:var(--acc)}.mslot.add .e{color:var(--acc)}
.msheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.msh{width:100%;max-width:640px;max-height:80vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:8px 14px calc(var(--sab) + 18px);animation:up .25s both}
.mpk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mpi{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);background:rgba(0,0,0,.3);color:var(--txt);font-size:13px;text-align:left}
.mpi span{font-size:22px}.mpi i{color:#ffd23a;font-style:normal}.mpi.got{transform:scale(.95);border-color:var(--acc)}
.mqty{display:flex;align-items:center;justify-content:center;gap:24px;margin:14px 0}
.mqty button{width:56px;height:56px;border-radius:16px;border:1px solid var(--line2);background:var(--card);color:var(--hi);font-size:26px}
.mqty b{font:700 34px var(--mono);color:var(--hi);min-width:60px;text-align:center}
.mact{display:flex;gap:8px}.mact .big{flex:1;margin-top:6px}
.pc{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 5px;border-radius:20px;border:1px solid var(--line2);background:rgba(10,25,18,.92);color:var(--dim);font-size:12.5px;white-space:nowrap}
.pc i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#1a2a22;color:var(--dim)}
.pc i svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pc.on{color:#fff;border-color:var(--pc)}.pc.on i{background:var(--pc);color:#fff}
.pc.near{color:var(--acc);border-color:var(--acc)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;max-height:55%;overflow:auto;background:var(--bg2);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;padding:6px 12px 14px}
#sheet.on{transform:none}
.sh-h{display:flex;align-items:center;padding:8px 2px;font:600 11px var(--mono);letter-spacing:.2em;color:var(--dim)}
.sh-h button{margin-left:auto;border:0;background:none;color:var(--dim);font-size:16px}
.nrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.nrow i{width:10px;height:10px;border-radius:50%;flex:none}.nrow span{flex:1;min-width:0}
.nrow b{display:block;color:var(--hi);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nrow small{color:var(--dim);font-size:12px}
.nrow em{font:normal 12px var(--mono);color:var(--acc)}
.maplibregl-popup-content{background:var(--bg2)!important;color:var(--txt);border:1px solid var(--line2);border-radius:12px!important}
.maplibregl-popup-tip{display:none}
.pop b{color:var(--hi)}.pop button{margin-top:8px;width:100%;height:34px;border-radius:10px;border:1px solid var(--acc);background:rgba(46,207,133,.12);color:var(--acc2);font:600 11px var(--mono);letter-spacing:.1em}
#ract{position:absolute;right:12px;bottom:calc(var(--sab) + 14px);display:flex;flex-direction:column;gap:8px;z-index:3}
#ract button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line2);background:rgba(10,25,18,.94);color:var(--acc);font-size:20px}
#ract button.on{background:var(--acc);color:#04120a}
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:6px}
.li span{flex:1;min-width:0}.li b{display:block;color:var(--hi);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li small{color:var(--dim);font:11px var(--mono)}
.li.off{opacity:.45}.li button{border:0;background:none;color:var(--dim);font-size:16px;padding:4px}
#minvHud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mh{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.mh>span{font-size:26px}.mh div{flex:1;min-width:0}.mh small{display:block;font:600 10px var(--mono);letter-spacing:.18em;color:var(--dim)}
.mh b{font:700 20px var(--mono);display:block}.mh b em{font:normal 11px var(--mono);color:var(--dim)}
.mh i{display:block;height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}.mh u{display:block;height:100%;border-radius:5px}
#minvBoxes{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.mbx{flex:none;height:36px;padding:0 14px;border-radius:20px;border:1px solid var(--line2);background:var(--card);color:var(--dim);font-size:13px;white-space:nowrap}
.mbx.on{color:var(--hi);border-color:var(--acc);background:rgba(46,207,133,.1)}
#minvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;margin:4px 0 14px}
.mslot{position:relative;aspect-ratio:1;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--rc) 55%,transparent);background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%),rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.mslot .e{font-size:30px;margin-top:-10px}.mslot>b{position:absolute;right:6px;top:3px;font:700 12px var(--mono);color:#fff;text-shadow:0 1px 3px #000}
.mslot .d{position:absolute;left:5px;top:4px;font:600 9px var(--mono);font-style:normal}.mslot .f{position:absolute;left:6px;bottom:18px;color:#ffd23a;font-size:10px;font-style:normal}
.mslot small{position:absolute;left:3px;right:3px;bottom:4px;font-size:9.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button{min-width:0}

/* ── tablets & iPads: side rail, wider content, map list as side panel ── */
@media (min-width:768px){
  nav{top:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding:calc(var(--sat) + 76px) 6px calc(var(--sab) + 10px);border-top:0;border-right:1px solid var(--line)}
  nav button{flex:none;padding:12px 0;border-radius:14px}
  nav button.on{background:rgba(46,207,133,.08)}
  header{left:92px}
  header .logo{display:none}
  .nlogo{display:grid!important;place-items:center;position:absolute;top:calc(var(--sat) + 14px);left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);color:var(--acc);font:700 20px var(--mono);box-shadow:0 0 18px rgba(46,207,133,.18) inset}
  .view{left:92px;bottom:var(--sab)}
  #toast{bottom:calc(var(--sab) + 24px);left:calc(50% + 46px)}
  .pad{max-width:1100px;margin:0 auto;padding:10px 28px 30px}
  #books{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  #books .card{margin:0}
  #mylists{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  #qhits{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
  #v-set .pad{max-width:760px}
  #sheet{left:12px;right:auto;top:64px;bottom:12px;width:360px;max-height:none;border-radius:18px;border:1px solid var(--line2);transform:translateX(-110%)}
  #sheet.on{transform:none}
  #poibar{left:12px;right:80px}
  #minvHud{grid-template-columns:repeat(2,minmax(0,320px))}
  #minvGrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .mslot .e{font-size:38px}
  #reader .rbar{padding-left:16px;padding-right:16px}
  #rhits{left:50%;right:auto;width:min(640px,90vw);transform:translateX(-50%)}
  #ract{right:24px;bottom:calc(var(--sab) + 24px)}
}
@media (min-width:1100px){ #mylists{grid-template-columns:1fr 1fr} }
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lang{margin-left:6px}

/* ═══ v0.24 design system (same as the PC app): Inter + JetBrains Mono, calmer caps, colour with meaning ═══ */
:root{--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ok:#2ecf85;--warn:#f5a524;--bad:#f2555a;--info:#4aa8ff;--muted:#6f8a7d;--edge:rgba(255,255,255,.075);--edge2:rgba(255,255,255,.13);
  --s1:rgba(255,255,255,.025);--s2:rgba(255,255,255,.045);--s3:rgba(255,255,255,.07)}
html,body{font-family:var(--sans);font-feature-settings:"cv11","ss01"}
.k{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav button{font:500 10.5px var(--sans);letter-spacing:0}
.brand{font:700 12px var(--mono);letter-spacing:.26em}.brand small{font:500 11px var(--sans);letter-spacing:0}
.hbtn{font:600 12px var(--sans);letter-spacing:0;border-color:var(--edge2);background:var(--s2);color:var(--hi)}
.big{font:650 14px var(--sans);letter-spacing:0;border:0;background:var(--ok);color:#03140b;box-shadow:0 10px 26px -12px rgba(46,207,133,.8)}
.big.ghost{background:var(--s2);border:1px solid var(--edge2);color:var(--hi);box-shadow:none}
.card,.li,.trk,.gstats div,.dhist{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--edge)}
.card{border-radius:16px}.li{border-radius:14px}
.pc{border-color:var(--edge2)}
.tip{color:var(--muted)}
.nav-card{border-color:rgba(74,168,255,.5);background:rgba(74,168,255,.1)}
.nav-card .nd{color:var(--info)}
.nav-card.off{border-color:rgba(245,165,36,.6);background:rgba(245,165,36,.1)}
.trk.rec{border-color:var(--bad)}
.gstats small,.trk .tn small{font:600 10px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.gstats b,.trk .tn b,.cmp-c b,.nav-card .nd{font-family:var(--mono);font-variant-numeric:tabular-nums}
.view.on{animation:vin .28s cubic-bezier(.2,.8,.2,1)}

      const b = await this.buf(off, len), v = new DataView(b.buffer, b.byteOffset, b.byteLength);
      const mime = v.getUint16(0, true), ns = String.fromCharCode(v.getUint8(3));
      d = {i, mime, ns};

      else if(mime === 0xfffe || mime === 0xfffd){ p = 8 }
      else { d.cluster = v.getUint32(8, true); d.blob = v.getUint32(12, true); p = 16 }
      const z1 = b.indexOf(0, p), z2 = z1 < 0 ? -1 : b.indexOf(0, z1 + 1);
      if(z2 < 0){ if(len >= 65536) throw new Error('dirent'); len *= 8; continue }
      d.path = td.decode(b.subarray(p, z1)); d.title = td.decode(b.subarray(z1 + 1, z2)) || d.path;
      break;
    }
    if(this.dc.size > 4000) this.dc.clear();
    this.dc.set(i, d); return d;
  }
  async follow(d){ for(let n = 0; d && d.mime === 0xffff && n < 8; n++) d = await this.dirent(d.redirect); return d }
  async find(ns, path){
    let lo = 0, hi = this.count - 1;
    while(lo <= hi){
      const mid = (lo + hi) >> 1, d = await this.dirent(mid);
      const c = d.ns < ns ? -1 : d.ns > ns ? 1 : d.path < path ? -1 : d.path > path ? 1 : 0;
      if(c === 0) return d;
      if(c < 0) lo = mid + 1; else hi = mid - 1;
    }
    return null;
  }
  async cluster(c){
    if(this.cc.has(c)) return this.cc.get(c);
    const pv = await this.dv(this.clusterPtr + 8 * c, c + 1 < this.clusters ? 16 : 8);
    const start = u64(pv, 0), end = c + 1 < this.clusters ? u64(pv, 8) : this.checksum;
    const info = (await this.buf(start, 1))[0], comp = info & 15, ext = !!(info & 16);
    const cl = {start, end, comp, ext};

    else if(comp === 4 || comp === 2 || comp === 3) throw new Error('xz');

  }

    d = await this.follow(d);

      const v = new DataView(cl.data.buffer, cl.data.byteOffset, cl.data.byteLength);
      const a = rd(v, d.blob * os), b = rd(v, (d.blob + 1) * os);
      return cl.data.subarray(a, b);
    }
    const v = await this.dv(cl.start + 1 + d.blob * os, 2 * os);
    const a = rd(v, 0), b = rd(v, os);

  }
  async text(ns, path){ const d = await this.find(ns, path); return d ? td.decode(await this.blob(d)) : '' }
  mime(d){ return this.mimes[d.mime] || 'application/octet-stream' }
  /* title list: front-article listing (new files) or full title index */
  async titleAt(k){
    if(this.listing){

    const variants = [...new Set([q, q[0].toUpperCase() + q.slice(1), q.replace(/(^|\s)\S/g, m => m.toUpperCase()), q.toLowerCase()])];
    for(const v of variants){
      let lo = 0, hi = N;
      while(lo < hi){
        const mid = (lo + hi) >> 1, d = await this.titleAt(mid);
        const less = this.listing ? d.title < v : (d.ns < ns || (d.ns === ns && d.title < v));
        if(less) lo = mid + 1; else hi = mid;
      }
      for(let k = lo, seen = 0; k < N && seen < 40 && out.size < n; k++, seen++){
        const d = await this.titleAt(k);
        if((!this.listing && d.ns !== ns) || !d.title.startsWith(v)) break;
        if(d.mime !== 0xffff && !this.mime(d).startsWith('text/html')) continue;
        if(!out.has(d.path)) out.set(d.path, d);

    let d = null;

    return this.follow(d);
  }

  base(d){ return this.newNs ? d.path : d.ns + '/' + d.path }
  async byUrl(p){
    if(this.newNs) return this.follow(await this.find('C', p));
    const i = p.indexOf('/'); if(i < 0) return null;
    return this.follow(await this.find(p.slice(0, i), p.slice(i + 1)));
  }
}

async function addFiles(list){
  let n = 0;
  list = [...list].sort((a, b) => /\.pmtiles$/i.test(b.name) - /\.pmtiles$/i.test(a.name));
  for(const f of list){
    const name = f.name.toLowerCase();
    try{
      if(name.endsWith('.pmtiles')){ await openMapFile(f); n++; continue }
      if(name.endsWith('.gpx')){ addGpx(f.name, await f.text()); n++; continue }
      if(name.endsWith('.json')){ loadUserFile(JSON.parse(await f.text()), f); n++; continue }
      if(BOOKS.some(b => b.f.name === f.name && b.size === f.size)) continue;
      const z = await new Zim(f).open(); BOOKS.push(z); n++;
    }catch(e){ toast(e.message === 'notzim' ? t('notzim', {f:f.name}) : f.name + ': ' + e.message) }
  }
  BOOKS.sort((a, b) => (/wikipedia/i.test(b.f.name) ? 1 : 0) - (/wikipedia/i.test(a.f.name) ? 1 : 0) || a.title.localeCompare(b.title));
  renderBooks(); renderLists(); if(n) toast(t('opened', {n}));
}

async function openBook(b, path){
  CUR = b; HIST = []; b.page = null; RES.forEach(u => URL.revokeObjectURL(u)); RES = new Map();
  $('#reader').classList.add('on'); $('#rq').value = ''; $('#rq').placeholder = t('search_in', {b:b.title});
  if(path) return show(path);
  const d = await b.mainPage(); show(d ? b.base(d) : '');
}
async function res(b, p){
  if(RES.has(p)) return RES.get(p);
  const d = await b.byUrl(p); if(!d) return '';
  let data = await b.blob(d), type = b.mime(d);
  if(type.startsWith('text/css')){
    let css = td.decode(data); const urls = [...new Set([...css.matchAll(/url\(\s*['"]?([^'")]+)['"]?\s*\)/g)].map(m => m[1]))];
    for(const u of urls){ if(/^(data:|https?:|#)/.test(u)) continue; const r = await res(b, resolve(p, u).path).catch(() => ''); if(r) css = css.split(u).join(r) }
    data = css;
  }
  const url = URL.createObjectURL(new Blob([data], {type})); RES.set(p, url); return url;
}
function resolve(base, href){
  const enc = base.split('/').map(encodeURIComponent).join('/');
  const u = new URL(href, 'http://z/' + enc);
  let path = u.pathname.slice(1); try{ path = decodeURIComponent(path) }catch{}
  return {path, hash:u.hash};
}
async function show(path, hash = '', push = true){
  const b = CUR, bar = $('#rload'); bar.style.width = '30%';
  const d = await b.byUrl(path).catch(e => { toast(e.message === 'xz' ? t('xz') : e.message); return null });
  if(!d){ bar.style.width = '0'; toast(t('notfound')); return }
  const real = b.base(d);
  if(!b.mime(d).startsWith('text/html')){ const u = await res(b, real); window.open(u); bar.style.width = '0'; return }
  if(push){ if(CUR.page) HIST.push(CUR.page) }
  CUR.page = real; CUR.pageTitle = d.title; updateRact();
  const doc = new DOMParser().parseFromString(td.decode(await b.blob(d)), 'text/html');
  doc.querySelectorAll('script').forEach(s => s.remove());
  bar.style.width = '60%';
  const jobs = [];
  doc.querySelectorAll('img[src],source[src],video[src],audio[src],track[src],video[poster],link[rel~=stylesheet][href],img[srcset],source[srcset]').forEach(el => {
    for(const attr of ['src', 'href', 'poster']){
      const v = el.getAttribute(attr); if(!v || /^(data:|https?:|blob:|#)/.test(v)) continue;
      if(attr === 'href' && el.tagName !== 'LINK') continue;
      jobs.push(res(b, resolve(real, v).path).then(u => u && el.setAttribute(attr, u)).catch(() => {}));
    }
    if(el.hasAttribute('srcset')) el.removeAttribute('srcset');
  });
  await Promise.all(jobs);
  const head = doc.head || doc.documentElement;
  const st = doc.createElement('style');
  st.textContent = 'html{-webkit-text-size-adjust:100%}body{max-width:100%;overflow-x:hidden;padding:0 10px;word-wrap:break-word}img{max-width:100%;height:auto}table{display:block;overflow-x:auto;max-width:100%}@media(max-width:600px){.thumb,.tright,.tleft,figure,.infobox,[style*="float"]{float:none!important;margin:10px 0!important;max-width:100%!important;width:auto!important}}' +
    (LOOK === 'dark' ? 'html{filter:invert(.92) hue-rotate(180deg);background:#fff}img,video,picture,svg image,[style*="background-image"]{filter:invert(1) hue-rotate(180deg)}' : '');
  head.appendChild(st);
  const mv = doc.createElement('meta'); mv.name = 'viewport'; mv.content = 'width=device-width,initial-scale=1'; head.prepend(mv);
  const fr = $('#frame');
  fr.onload = () => {
    bar.style.width = '100%'; setTimeout(() => bar.style.width = '0', 300);
    const w = fr.contentWindow, dd = fr.contentDocument;
    if(hash){ const tgt = dd.getElementById(decodeURIComponent(hash.slice(1))); if(tgt) tgt.scrollIntoView() } else w.scrollTo(0, 0);
    dd.addEventListener('click', ev => {
      const a = ev.target.closest('a[href]'); if(!a) return;
      const href = a.getAttribute('href');
      if(href.startsWith('#')) return;
      ev.preventDefault();
      if(/^[a-z]+:/i.test(href)){ toast(t('external')); return }
      const r = resolve(real, href); show(r.path, r.hash);
    });
    // sections in mobile Wikipedia are collapsed with JS; open them
    dd.querySelectorAll('details').forEach(x => x.open = true);
    dd.querySelectorAll('.collapsible-block,.mf-section-1,.mf-section-2,.mf-section-3,.mf-section-4,.mf-section-5,.mf-section-6,.mf-section-7,.mf-section-8,.mf-section-9').forEach(x => x.style.display = 'block');
  };
  fr.srcdoc = '<!DOCTYPE html>' + doc.documentElement.outerHTML;
}

/* ───────── GPX tracks on the map ───────── */
const GPX = [];
function addGpx(name, text){
  const d = new DOMParser().parseFromString(text, 'application/xml'), lines = [], pts = [];
  d.querySelectorAll('trkseg, rte').forEach(seg => {
    const c = [...seg.querySelectorAll('trkpt, rtept')].map(p => [+p.getAttribute('lon'), +p.getAttribute('lat')]);
    if(c.length > 1) lines.push(c);
  });
  d.querySelectorAll('wpt').forEach(p => pts.push({c:[+p.getAttribute('lon'), +p.getAttribute('lat')], n:p.querySelector('name')?.textContent || ''}));
  if(!lines.length && !pts.length) throw new Error('empty GPX');
  GPX.push({name, lines, pts, text, mine:false}); drawGpx();
  const all = lines.flat().concat(pts.map(p => p.c));
  if(MAP && all.length) MAP.fitBounds([[Math.min(...all.map(c => c[0])), Math.min(...all.map(c => c[1]))], [Math.max(...all.map(c => c[0])), Math.max(...all.map(c => c[1]))]], {padding:60, maxZoom:15});
}
function drawGpx(){
  if(!MAP || !MAP.isStyleLoaded() || !GPX.length) return;
  const cols = ['#ff5ad1', '#3ad7ff', '#ffd23a', '#9b7bff'], feats = [];
  GPX.forEach((g, i) => { g.lines.forEach(l => feats.push({type:'Feature', properties:{c:cols[i % 4]}, geometry:{type:'LineString', coordinates:l}}));
    g.pts.forEach(p => feats.push({type:'Feature', properties:{c:cols[i % 4], n:p.n}, geometry:{type:'Point', coordinates:p.c}})) });
  const data = {type:'FeatureCollection', features:feats};
  if(MAP.getSource('gpx')) return MAP.getSource('gpx').setData(data);
  MAP.addSource('gpx', {type:'geojson', data});
  MAP.addLayer({id:'gpx-c', type:'line', source:'gpx', filter:['==', '$type', 'LineString'], layout:{'line-cap':'round', 'line-join':'round'}, paint:{'line-color':'#000', 'line-width':7, 'line-opacity':.45}});
  MAP.addLayer({id:'gpx-l', type:'line', source:'gpx', filter:['==', '$type', 'LineString'], layout:{'line-cap':'round', 'line-join':'round'}, paint:{'line-color':['get', 'c'], 'line-width':4}});
  MAP.addLayer({id:'gpx-p', type:'circle', source:'gpx', filter:['==', '$type', 'Point'], paint:{'circle-radius':6, 'circle-color':['get', 'c'], 'circle-stroke-color':'#fff', 'circle-stroke-width':2}});
}

function clearPending(){ for(const k of ['favorites', 'readlater', 'pins']){ PEND.add[k] = []; PEND.removed[k] = [] } PEND.notes = {}; PEND.inv = []; PEND.tracks = [] }
function loadUserFile(data, f){
  const u = data.user && data.nomad_backup ? data.user : data;
  if(!u || !Array.isArray(u.favorites)) throw new Error('not nomad-user.json');
  for(const k of ['favorites', 'readlater', 'pins']){
    let list = (u[k] || []).filter(x => !PEND.removed[k].includes(KEY[k](x)));
    const have = new Set(list.map(KEY[k]));
    PEND.add[k].forEach(x => { if(!have.has(KEY[k](x))) list.unshift(x) });
    UD[k] = list;
  }
  UD.notes = {...(u.notes || {}), ...PEND.notes};
  UD.inventory = u.inventory ? JSON.parse(JSON.stringify(u.inventory)) : null;
  UD.routes = Array.isArray(u.routes) ? u.routes : [];
  PEND.inv.forEach(op => applyInvOp(UD, op));
  if(u._pc && u._pc.urls){ const known = ls.get('nm.pcs', []); ls.set('nm.pcs', [...new Set([...u._pc.urls, ...known])].slice(0, 6)) }
  SYNCINFO = {date:new Date(f.lastModified || Date.now()).toLocaleString(), f:UD.favorites.length, r:UD.readlater.length, p:UD.pins.length};
  ls.set('nm.syncinfo', SYNCINFO); saveUD(); if(f.name) toast(t('user_loaded'));
}
function toggleItem(kind, item){
  const key = KEY[kind](item), i = UD[kind].findIndex(x => KEY[kind](x) === key);
  if(i >= 0){
    UD[kind].splice(i, 1);
    const a = PEND.add[kind].findIndex(x => KEY[kind](x) === key);
    if(a >= 0) PEND.add[kind].splice(a, 1); else if(!PEND.removed[kind].includes(key)) PEND.removed[kind].push(key);
  } else {
    UD[kind].unshift(item);
    const r = PEND.removed[kind].indexOf(key);
    if(r >= 0) PEND.removed[kind].splice(r, 1); else PEND.add[kind].push(item);
  }
  saveUD();
}

function applyInvOp(U, op){
  const I = U.inventory; if(!I) return;
  const st = I.stacks;
  if(op.op === 'add'){
    const same = st.find(x => x.item === op.item && x.box === op.box && (x.exp || '') === (op.exp || ''));
    if(same) same.qty += op.qty; else st.push({uid:op.uid, item:op.item, qty:op.qty, box:op.box, exp:op.exp || '', note:'', added:op.t});
  } else {
    const x = st.find(y => y.uid === op.uid); if(!x) return;
    if(op.op === 'qty') x.qty += op.d; if(op.op === 'set') x.qty = op.n;
    if(op.op === 'del' || x.qty <= 0) st.splice(st.indexOf(x), 1);
  }
}

/* ───────── automatic sync with NOMAD on the PC (same Wi-Fi) ───────── */
const LIVE = {url:null, name:'', busy:false};
async function tryUrl(base, payload){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 3500);
  try{
    const r = await fetch(base.replace(/\/$/, '') + '/api/sync', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), signal:ctl.signal});
    clearTimeout(tm); if(!r.ok) return null; return await r.json();
  }catch(e){ clearTimeout(tm); return null }
}
async function syncNow(manual){
  if(LIVE.busy) return; LIVE.busy = true;
  const cands = [...new Set([LIVE.url, ...(location.protocol.startsWith('http') && location.port ? [location.origin] : []), ...ls.get('nm.pcs', []), ls.get('nm.pcmanual', '')].filter(Boolean))];
  const payload = syncPayload(), sent = pendingCount();
  let res = null, used = null;
  for(const u of cands){ res = await tryUrl(u, payload); if(res && res.ok){ used = u; break } }
  LIVE.busy = false;
  if(!res || !res.ok){ LIVE.url = null; renderSync(); if(manual) toast(t('sync_nopc')); return }
  LIVE.url = used; LIVE.name = res.pc?.name || '';
  ls.set('nm.pcs', [...new Set([used, ...(res.pc?.urls || []), ...ls.get('nm.pcs', [])])].slice(0, 6));
  // remove exactly what was sent; changes made while syncing stay pending
  PEND.inv.splice(0, payload.inv_ops.length);
  PEND.tracks.splice(0, payload.tracks.length);
  for(const k of ['favorites', 'readlater', 'pins']){
    const ka = new Set(payload.user[k].map(KEY[k])), kr = new Set(payload.removed[k]);
    PEND.add[k] = PEND.add[k].filter(x => !ka.has(KEY[k](x))); PEND.removed[k] = PEND.removed[k].filter(x => !kr.has(x));
  }
  for(const n of Object.keys(payload.user.notes)) if(PEND.notes[n] === payload.user.notes[n]) delete PEND.notes[n];
  loadUserFile(res.user, {lastModified:Date.now()});
  if(sent && (manual || true)) toast('✓ ' + t('sync_ok', {n:sent}));
}
let _syncT = 0;
function syncSoon(){ clearTimeout(_syncT); if(pendingCount()) _syncT = setTimeout(() => syncNow(false), 1200) }
setInterval(() => syncNow(false), 20000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) syncNow(false) });

  if(v === 'map'){ initMap(); setTimeout(() => MAP && MAP.resize(), 50) }
  if(v === 'inv') renderMInv();
  if(v === 'gps') gpsStart();
}
$$('nav button').forEach(b => b.onclick = () => setView(b.dataset.v));
$$('#langSeg button').forEach(b => b.onclick = () => { LANG = b.dataset.v; ls.set('nm.lang', LANG); i18n(); if(MAP){ MAP.remove(); MAP = null; initMap() } });
$$('#lookSeg button').forEach(b => b.onclick = () => { LOOK = b.dataset.v; ls.set('nm.look', LOOK); i18n(); if($('#reader').classList.contains('on') && CUR?.page) show(CUR.page, '', false) });
i18n(); renderLists(); renderSync(); renderPoiBar();
$('#syncLive').onclick = () => syncNow(true);
$('#pcAddr').value = ls.get('nm.pcmanual', '');
$('#pcAddr').onchange = e => { let v = e.target.value.trim(); if(v && !/^https?:/.test(v)) v = 'http://' + v; if(v && !/:\d+/.test(v.replace(/^https?:\/\//, ''))) v += ':8090'; ls.set('nm.pcmanual', v); e.target.value = v; syncNow(true) };
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
